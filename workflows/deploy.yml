name: Deploy to Google Script
on: [push]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Install Clasp
        run: npm install -g @google/clasp
      - name: Deploy
        run: clasp push
        env:
          CLASP_SETTING: ${{ secrets.CLASP_CONFIG }}