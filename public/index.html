<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torn War Bridge</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⚔️ Torn War Bridge</h1>
            <p>Faction management and FF analysis</p>
        </header>

        <div class="control-panel">
            <div class="input-group">
                <label for="userIdInput">Your User ID:</label>
                <input type="text" id="userIdInput" placeholder="Enter your User ID">
            </div>
            <div class="input-group">
                <label for="factionIdInput">Faction ID:</label>
                <input type="text" id="factionIdInput" placeholder="Enter Faction ID">
            </div>
            <button id="loadButton" class="btn-primary">Load Faction</button>
        </div>

        <div class="data-section">
            <div id="playerData" class="card">
                <p>Enter your details above</p>
            </div>
            <div id="factionData" class="card">
                <p>Loading...</p>
            </div>
        </div>

        <div class="data-section">
            <div id="membersData" class="card">
                <p>Waiting for input...</p>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
