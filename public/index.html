<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torn War Bridge - Tactical Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 Torn War Bridge</h1>
            <p>Automated Tactical Dashboard</p>
        </header>

        <main>
            <section class="dashboard">
                <div class="card faction-info">
                    <h2>Faction Overview</h2>
                    <div id="factionData">Loading faction data...</div>
                </div>

                <div class="card member-stats">
                    <h2>Member Statistics</h2>
                    <div id="memberData">Loading member data...</div>
                </div>

                <div class="card weapon-info">
                    <h2>Weapon Arsenal</h2>
                    <div id="weaponData">Loading weapon data...</div>
                </div>
            </section>
        </main>

        <footer>
            <p>Torn War Bridge v1.0 | Real-time tactical intelligence</p>
        </footer>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
