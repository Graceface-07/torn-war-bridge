<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>War Analysis - FF Scouter Report</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #007bff;
        }
        
        header h1 {
            margin-bottom: 10px;
            color: #007bff;
        }
        
        .header-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .info-item {
            background: #333;
            padding: 10px;
            border-radius: 5px;
        }
        
        .info-label {
            font-size: 0.9em;
            color: #aaa;
        }
        
        .info-value {
            font-size: 1.2em;
            font-weight: bold;
            color: #fff;
        }
        
        .scenario-section {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 4px solid #28a745;
        }
        
        .scenario-section h2 {
            margin-bottom: 20px;
            color: #28a745;
        }
        
        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-box {
            background: #333;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            border-top: 3px solid;
        }
        
        .stat-box.safe {
            border-top-color: #28a745;
        }
        
        .stat-box.prime {
            border-top-color: #ffc107;
        }
        
        .stat-box.risky {
            border-top-color: #fd7e14;
        }
        
        .stat-box.suicide {
            border-top-color: #dc3545;
        }
        
        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #fff;
        }
        
        .stat-label {
            font-size: 0.9em;
            color: #aaa;
            margin-top: 5px;
        }
        
        .targets-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #333;
            border-radius: 5px;
            overflow: hidden;
        }
        
        .targets-table thead {
            background: #444;
        }
        
        .targets-table th {
            padding: 12px;
            text-align: left;
            font-weight: bold;
            color: #fff;
            border-bottom: 2px solid #555;
        }
        
        .targets-table td {
            padding: 12px;
            border-bottom: 1px solid #444;
        }
        
        .targets-table tr:hover {
            background: #3a3a3a;
        }
        
        .category-safe {
            background: rgba(40, 167, 69, 0.2);
            color: #28a745;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        
        .category-prime {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        
        .category-risky {
            background: rgba(253, 126, 20, 0.2);
            color: #fd7e14;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        
        .category-suicide {
            background: rgba(220, 53, 69, 0.2);
            color: #dc3545;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        
        .advice {
            font-size: 0.9em;
            color: #bbb;
            font-style: italic;
        }
        
        .back-button {
            display: inline-block;
            padding: 10px 20px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 20px;
            cursor: pointer;
            border: none;
            font-size: 1em;
        }
        
        .back-button:hover {
            background: #0056b3;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
        }
        
        .error {
            background: #dc3545;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="back-button" onclick="goBack()">← Back to Dashboard</button>
        
        <header>
            <h1>⚔️ War Analysis - FF Scouter Report</h1>
            <div class="header-info">
                <div class="info-item">
                    <div class="info-label">Player ID</div>
                    <div class="info-value" id="playerId">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Your Battle Stats</div>
                    <div class="info-value" id="playerStats">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Fair Fight</div>
                    <div class="info-value" id="playerFF">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Generated</div>
                    <div class="info-value" id="generatedTime">-</div>
                </div>
            </div>
        </header>
        
        <div id="loadingIndicator" class="loading">
            <p>Loading faction data and analyzing targets...</p>
        </div>
        
        <div id="analysisResults" style="display: none;">
            <div class="scenario-section" id="scenario72M"></div>
            <div class="scenario-section" id="scenario82M"></div>
        </div>
        
        <div id="errorContainer"></div>
    </div>

    <script src="war-analysis.js"></script>
    <script>
        // Initialize analysis when page loads
        window.addEventListener('load', function() {
            runWarAnalysis();
        });
        
        function goBack() {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
